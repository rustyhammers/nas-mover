name: Release

# Pushing a tag like v1.2.0 (see scripts/release.sh) builds, signs and publishes that version.
# Installed copies pick it up through Sparkle (appcast.xml on the latest release).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make sure the annotated tag (release notes) is present
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 PACKAGE=1 ./build.sh

      - name: Sign the update and write appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/NAS-Mover-${GITHUB_REF_NAME#v}.zip" dist/appcast.xml \
            --title "NAS Mover ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
